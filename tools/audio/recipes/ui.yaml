# UI (AUDIO §3): dry and tactile. The menu "click" is a real hammer on the anvil.
events:
  ui_tap:                          # switch click
    lufs: -28
    variants: 3
    layers:
      - {src: "oga_ui_51/**/switch[1-3].wav", hp: 200, gain: 0, fade: 0.03}
  ui_back:                         # softer, reversed-feel click
    lufs: -30
    variants: 2
    layers:
      - {src: "oga_ui_51/**/switch[4-5].wav", hp: 200, lp: 5000, pitch: -3, gain: 0, fade: 0.03}
  ui_toggle:                       # latch
    lufs: -28
    variants: 2
    layers:
      - {src: "oga_mechanical/lightclunk*.wav", dur: 0.1, hp: 300, gain: 0, fade: 0.03}
  ui_notch:                        # detent tick per slider notch
    lufs: -30
    variants: 3
    layers:
      - {src: "oga_ui_kenney/**/tick_00*.ogg", hp: 400, gain: 0, fade: 0.02}
  ui_open:                         # steel shutter drop: short and low
    lufs: -26
    layers:
      - {src: "oga_metal_wood/metal_sheet_05.ogg", dur: 0.25, pitch: -5, hp: 80, lp: 3500, gain: 0, fade: 0.1}
      - {synth: thump, at: 0, dur: 0.08, f0: 90, f1: 55, decay: 0.03, gain: -8}
  ui_close:                        # shutter up
    lufs: -27
    layers:
      - {src: "oga_metal_wood/metal_sheet_05.ogg", dur: 0.22, pitch: -2, hp: 150, lp: 4000, gain: 0, fade: 0.08}
  ui_error:                        # dull double knock
    lufs: -27
    layers:
      - {src: "oga_wood_metal_2/**/wood2.aif", dur: 0.1, lp: 1500, gain: 0, fade: 0.04}
      - {src: "oga_wood_metal_2/**/wood2.aif", at: 0.11, dur: 0.12, lp: 1300, gain: -1, fade: 0.05}
  ui_select:                       # menu select: real hammer on the anvil, short
    lufs: -24
    ring: 0.3
    variants: 2
    layers:
      - {src: "oga_hammer_anvil/forger_0.ogg", start: [0.0, 0.58], dur: 0.25, hp: 200, gain: 0, fade: 0.15}
      - {synth: thump, at: 0, dur: 0.08, f0: 100, f1: 60, decay: 0.03, gain: -8}
  wipe_quench:                     # transition: short hiss sweep
    lufs: -26
    layers:
      - {src: "oga_steam/steam hisses - Marker #2.wav", dur: 0.55, hp: 1500, gain: 0, fade: 0.3, fade_in: 0.04}
  wipe_stamp:                      # transition: anvil impact + metal tail
    lufs: -20
    layers:
      - {src: "oga_sfx100/slam_02.ogg", dur: 0.35, hp: 50, gain: 0, fade: 0.1}
      - {src: "oga_metal_wood/metal_falling_02.ogg", at: 0.03, dur: 0.6, hp: 600, gain: -10, fade: 0.3}
      - {synth: thump, at: 0, dur: 0.15, f0: 95, f1: 45, decay: 0.05, gain: -4}
