name: deploy-worker
on:
  push:
    branches: [main]
    paths: ['server/**', 'shared/**', 'client/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
concurrency: { group: deploy-worker, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Deploy (skipped until CLOUDFLARE_API_TOKEN is set)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "No CLOUDFLARE_API_TOKEN secret: skipping deploy"; exit 0; fi
          npm run deploy -w server
